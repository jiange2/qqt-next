# backend-next 部署编排（与旧 PHP 栈 docker-compose.yml 平行，互不影响）
#
#   docker compose -f docker-compose.next.yml up -d --build
#
# 服务：
#   db   — 新库 MySQL（qqt_next，schema 由容器启动时 prisma migrate deploy 建立）
#   app  — Fastify 服务：/api.php 与 /legacy/api.php（旧协议）、/admin/*（管理 API）、
#          /admin/（管理面板静态）；媒体文件存阿里云 OSS（ADR 0004）
#
# 首次部署初始化顺序：
#   1. up -d db，等健康
#   2. 从旧库一次性迁移数据（可在宿主机跑，也可用 migrate 一次性服务）：
#      docker compose -f docker-compose.next.yml run --rm app \
#        sh -c "cd server && node ../../node_modules/tsx/dist/cli.mjs scripts/migrate.ts --media-src=/legacy-media"
#      （LEGACY_DB_URL 指向旧库；/legacy-media 挂载旧 backend 站点目录以拷贝媒体文件）
#   3. 管理员账号由 migrate.ts 首次运行时创建（密码仅打印一次）
version: '3.8'

services:
  app:
    build:
      context: ./backend-next
      dockerfile: Dockerfile
    container_name: qqt-next-app
    restart: unless-stopped
    ports:
      - "8001:8000"
    environment:
      DATABASE_URL: mysql://root:${DB_PASSWORD:-lq520977WC}@db:3306/qqt_next
      LEGACY_DB_URL: mysql://root:${DB_PASSWORD:-lq520977WC}@db:3306/qqt
      JWT_SECRET: ${JWT_SECRET:?请在环境或 .env 中设置强随机 JWT_SECRET}
      PORT: "8000"
      ADMIN_DIST: /app/admin-web/dist
      # 阿里云 OSS（ADR 0004）：媒体对象存储，换 CDN 只改 OSS_PUBLIC_BASE
      OSS_REGION: ${OSS_REGION:?请在环境或 .env 中配置 OSS_REGION}
      OSS_BUCKET: ${OSS_BUCKET:?请在环境或 .env 中配置 OSS_BUCKET}
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID:?请在环境或 .env 中配置 OSS_ACCESS_KEY_ID}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET:?请在环境或 .env 中配置 OSS_ACCESS_KEY_SECRET}
      # 同 region ECS 上传走内网免流量费（SDK internal 参数）
      OSS_INTERNAL: ${OSS_INTERNAL:-false}
      OSS_PUBLIC_BASE: ${OSS_PUBLIC_BASE:?请在环境或 .env 中配置 OSS_PUBLIC_BASE}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    container_name: qqt-next-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-lq520977WC}
      MYSQL_DATABASE: qqt_next
    volumes:
      - next_mysql_data:/var/lib/mysql
    # 注意：不做宿主机端口映射，避免与本机/旧栈 MySQL 冲突；需要调试时放开下面注释
    # ports:
    #   - "3307:3306"
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-lq520977WC}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  next_mysql_data:
