# backend-next 生产部署编排（新服务器；MySQL 为宿主机宝塔安装，不进容器，见 ADR 0004）
#
# 交付方式：镜像由本地 scripts/release.ps1 构建推送 ACR（双 tag：vN + latest，版本每次打包 +1），
#           服务器上以 scripts/deploy.sh 拉取部署；回滚 = 指定旧 vN 重跑
#
# 服务：
#   app — Fastify：/api.php 与 /legacy/api.php（旧协议）、/admin/*（管理 API）、
#         /admin/（管理面板静态）；媒体文件存阿里云 OSS（ADR 0004）
#         仅绑定 127.0.0.1:8000，由宿主机 Nginx 反代（API :8001、Admin :8002，明文无 HTTPS）
#
# 拉镜像流量：同 region ECS 可在 .env 设 ACR_HOST 为 -vpc 内网域名，免公网流量费
#
# 首次部署（详见 docs/backend-next-deploy.md）：
#   1. 宝塔 MySQL 建库 qqt_next，账号 qqt_next（host 172.%，覆盖 compose 动态网段，仅授本库）
#   2. cp .env.example .env，填写 DB_PASSWORD / JWT_SECRET / OSS_*
#   3. ./deploy.sh vN
#   4. 生成初始管理员（幂等，密码仅打印一次）：
#      docker compose -f docker-compose.next.yml run --rm app \
#        sh -c "cd server && npx tsx scripts/seed-admin.ts"
#
# 数据迁移窗口（另约，ADR 0003 割接流程；旧库与旧站点媒体目录需可从新服务器访问）：
#   docker compose -f docker-compose.next.yml run --rm \
#     -e LEGACY_DB_URL="mysql://<user>:<pass>@<旧库地址>:3306/qqt" \
#     -v /path/to/旧backend目录:/legacy-media:ro \
#     app sh -c "cd server && npx tsx scripts/migrate.ts --media-src=/legacy-media"
version: '3.8'

services:
  app:
    image: ${ACR_HOST:-crpi-oyq5ia6dv9vty8p3.cn-shanghai.personal.cr.aliyuncs.com}/qqt7/qqt_repo:${IMAGE_TAG:-latest}
    container_name: qqt-next-app
    restart: unless-stopped
    ports:
      # 仅暴露给本机 Nginx 反代，不对公网开放
      - "127.0.0.1:8000:8000"
    extra_hosts:
      # 容器内经 host.docker.internal 访问宿主机宝塔 MySQL（3306 不对公网开放）
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: mysql://qqt_next:${DB_PASSWORD:?请在 .env 中设置 DB_PASSWORD}@host.docker.internal:3306/qqt_next
      JWT_SECRET: ${JWT_SECRET:?请在 .env 中设置强随机 JWT_SECRET}
      PORT: "8000"
      ADMIN_DIST: /app/admin-web/dist
      # 阿里云 OSS（ADR 0004）：媒体对象存储，换 CDN 只改 OSS_PUBLIC_BASE
      OSS_REGION: ${OSS_REGION:?请在 .env 中配置 OSS_REGION}
      OSS_BUCKET: ${OSS_BUCKET:?请在 .env 中配置 OSS_BUCKET}
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID:?请在 .env 中配置 OSS_ACCESS_KEY_ID}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET:?请在 .env 中配置 OSS_ACCESS_KEY_SECRET}
      # 服务器与 bucket 同 region：上传走内网免流量费
      OSS_INTERNAL: ${OSS_INTERNAL:-true}
      OSS_PUBLIC_BASE: ${OSS_PUBLIC_BASE:?请在 .env 中配置 OSS_PUBLIC_BASE}
      OSS_NAME_SECRET: ${OSS_NAME_SECRET:?请在 .env 中配置 OSS_NAME_SECRET}
